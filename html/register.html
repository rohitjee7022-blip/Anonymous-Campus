
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Anonymous Campus</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="header">
        <h2>Anonymous Campus</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="auth-container">
        <h1>Create your account</h1>
        <p>Register using your verified college email to participate anonymously.</p>

        <form id="registerForm" class="auth-form"> 

            <label for="studentEmail">College email</label>
            <input type="email" id="studentEmail" required>

            <label for="studentPassword">Password</label>
            <div class="password-box">
    <input type="password" id="studentPassword" required>

    <button type="button" class="toggle-password"
    onclick="togglePassword('studentPassword', this)">
        👁
    </button>
</div>

            <label for="confirmPassword">Confirm password</label>
            <div class="password-box">
    <input type="password" id="confirmPassword" required>

    <button type="button" class="toggle-password"
    onclick="togglePassword('confirmPassword', this)">
        👁
    </button>
</div>

            <button type="submit">Create account</button>
            <p id="authMessage"></p>
        </form>

        <p>Already registered? <a href="login.html">Login here</a></p>
    </main>

    <script type="module" src="../js/auth.js"></script>
</body>
</html>
